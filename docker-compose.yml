services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shiftmate
      POSTGRES_USER: shiftmate
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shiftmate}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftmate"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/shiftmate
      DB_USER: shiftmate
      DB_PASSWORD: ${DB_PASSWORD:-shiftmate}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ chars) in .env}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db-data:
