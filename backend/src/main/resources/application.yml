spring:
  application:
    name: rosterrelay
  datasource:
    url: ${DB_URL:jdbc:h2:mem:rosterrelay;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  error:
    include-stacktrace: never
  shutdown: graceful

app:
  jwt:
    # Always override JWT_SECRET in real deployments (min 32 chars).
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
    ttl: ${JWT_TTL:PT12H}
    issuer: rosterrelay
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  late-cancel-window: PT24H
  reminder-lead: PT24H
  reminder-interval: PT15M
  understaffed:
    horizon: PT72H
    fill-threshold: 0.6
  security:
    max-login-failures: 5
    lockout-window: PT15M
